<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Rasa — Strava for Emotions</title>
<style>
  :root { --bg:#0e0f13; --card:#1a1c22; --card2:#23262e; --text:#f2f3f5; --muted:#9aa0ab; --accent:#7c5cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:480px; margin:0 auto; padding:16px 16px 96px; }
  h1 { font-size:22px; margin:6px 0 2px; letter-spacing:.3px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border-radius:18px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .muted { color:var(--muted); }
  .center { text-align:center; }
  button { font:inherit; border:none; border-radius:14px; cursor:pointer; }
  .mic { width:104px; height:104px; border-radius:50%; background:var(--accent); color:#fff; font-size:34px;
         display:flex; align-items:center; justify-content:center; margin:8px auto; box-shadow:0 8px 30px rgba(124,92,255,.4); transition:transform .1s, background .2s; }
  .mic:active { transform:scale(.95); }
  .mic.recording { background:#ff4d4f; box-shadow:0 8px 30px rgba(255,77,79,.4); }
  .pill { display:inline-flex; align-items:center; gap:6px; background:var(--card2); border-radius:999px; padding:5px 10px; font-size:12px; margin:3px 4px 3px 0; }
  .bar { height:9px; border-radius:999px; background:#2c2f38; overflow:hidden; }
  .bar > div { height:100%; border-radius:999px; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #2a2d35; }
  .row:last-child { border-bottom:none; }
  .emoji { font-size:26px; }
  .grow { flex:1; min-width:0; }
  .title { font-weight:600; }
  .time { color:var(--muted); font-size:12px; }
  .dot { width:13px; height:13px; border-radius:50%; flex:none; }
  .tiles { display:flex; gap:10px; }
  .tile { flex:1; background:var(--card2); border-radius:14px; padding:12px; text-align:center; }
  .tile .v { font-size:20px; font-weight:700; }
  .tile .t { font-size:11px; color:var(--muted); }
  .heat { display:flex; gap:3px; }
  .heat > div { flex:1; height:30px; border-radius:4px; background:#2c2f38; }
  .heatlabels { display:flex; justify-content:space-between; color:var(--muted); font-size:9px; margin-top:4px; }
  .btn { display:block; width:100%; padding:15px; background:var(--accent); color:#fff; font-weight:600; border-radius:14px; }
  .btn:disabled { opacity:.6; }
  .toggle { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--muted); font-size:14px; margin:10px 0; }
  .toggle input { width:42px; height:24px; }
  .status { min-height:20px; color:var(--muted); font-size:13px; text-align:center; margin:8px 0; }
  nav { position:fixed; bottom:0; left:0; right:0; background:#15171d; border-top:1px solid #2a2d35; display:flex; }
  nav button { flex:1; background:none; color:var(--muted); padding:10px 0 26px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  nav button.active { color:var(--accent); }
  nav .ico { font-size:20px; }
  .hidden { display:none; }
  svg { width:100%; height:140px; }
  video { width:100%; border-radius:14px; background:#000; }
  .script { white-space:pre-wrap; line-height:1.5; }
  .scroll-x { overflow-x:auto; white-space:nowrap; }
  .avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#fff; flex:none; }
  .streak { display:flex; align-items:center; gap:4px; font-weight:600; font-size:14px; }
  .kudos { background:var(--card2); color:var(--muted); padding:8px 14px; border-radius:999px; font-size:13px; display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .kudos.on { color:var(--accent); }
  .friendfeel { display:flex; align-items:center; gap:10px; margin:12px 0 10px; }
  .cardfoot { display:flex; align-items:center; justify-content:space-between; border-top:1px solid #2a2d35; padding-top:10px; }

  /* ---- global polish ---- */
  body { background:radial-gradient(1200px 620px at 50% -12%, #1a1c2b 0%, var(--bg) 55%) fixed; }
  h1 { background:linear-gradient(90deg,#ffffff,#b9a7ff); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800; }
  .card { border:1px solid #23262f; box-shadow:0 8px 24px rgba(0,0,0,.28); }
  nav { backdrop-filter:saturate(140%) blur(14px); background:rgba(21,23,29,.82); }
  nav button { transition:color .15s, transform .1s; }
  nav button.active .ico { transform:translateY(-1px) scale(1.08); }
  a { color:inherit; }

  /* ---- timeline hero ---- */
  .eyebrow { font-size:11px; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); }
  .hero { background:linear-gradient(135deg,#20233492,#181a22), var(--card); border:1px solid #2a2d3a; }
  .herotop { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin:6px 0 12px; }
  .heromood { font-size:19px; font-weight:700; }
  .herochip { background:var(--card2); border-radius:999px; padding:6px 12px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .bar.big { height:12px; }

  /* ---- vertical timeline ---- */
  .tline { position:relative; }
  .tnode { display:flex; gap:14px; padding-bottom:16px; }
  .tnode:last-child { padding-bottom:0; }
  .rail { position:relative; width:14px; flex:none; display:flex; justify-content:center; }
  .rail::before { content:''; position:absolute; top:18px; bottom:-16px; width:2px; background:#2a2d35; }
  .tnode:last-child .rail::before { display:none; }
  .mk { width:14px; height:14px; border-radius:50%; margin-top:4px; z-index:1; box-shadow:0 0 0 4px var(--card), 0 0 12px rgba(124,92,255,.25); }
  .tbody { flex:1; min-width:0; background:var(--card2); border-radius:14px; padding:11px 13px; transition:transform .12s; }
  .tbody:hover { transform:translateX(2px); }

  /* ---- support / toolkit card ---- */
  .support.warm { border:1px solid rgba(124,92,255,.40); background:linear-gradient(180deg, rgba(124,92,255,.12), var(--card)); }
  .seclabel { font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:16px 2px 9px; }
  .link { display:flex; align-items:center; gap:12px; padding:11px 12px; background:var(--card2); border-radius:12px; margin-bottom:8px; text-decoration:none; color:var(--text); transition:transform .12s, background .2s; }
  .link:hover { background:#2b2f39; transform:translateY(-1px); }
  .link:last-child { margin-bottom:0; }
  .linkico { font-size:20px; flex:none; }
  .chev { color:var(--muted); font-size:15px; flex:none; }
  .breathe { display:flex; align-items:center; gap:14px; background:var(--card2); border-radius:14px; padding:14px; }
  .breathe .ball { width:46px; height:46px; border-radius:50%; flex:none; transform:scale(.62);
                   background:radial-gradient(circle at 35% 30%, #b6a2ff, #6b4cff); box-shadow:0 0 26px rgba(124,92,255,.5); }
  .breathe .ball.run { animation:boxbreath 16s ease-in-out infinite; }
  @keyframes boxbreath { 0%{transform:scale(.62)} 25%{transform:scale(1)} 50%{transform:scale(1)} 75%{transform:scale(.62)} 100%{transform:scale(.62)} }
  .mic { position:relative; }
  .mic.processing { background:var(--card2); box-shadow:none; pointer-events:none; }
  .mic.processing::after { content:''; position:absolute; inset:-6px; border-radius:50%; border:3px solid transparent; border-top-color:var(--accent); animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ldots span { animation:ldot 1.2s ease-in-out infinite; display:inline-block; opacity:0; }
  .ldots span:nth-child(2){ animation-delay:.2s; }
  .ldots span:nth-child(3){ animation-delay:.4s; }
  @keyframes ldot { 0%,80%,100%{opacity:0} 40%{opacity:1} }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎭 Rasa</h1>
  <div class="sub">Strava for emotions — your voice, your feelings, your day.</div>

  <!-- CHECK IN -->
  <section id="tab-checkin">
    <div class="card center">
      <div class="muted" id="recHint">Tap and tell me how it's going. A few seconds is plenty.</div>
      <label class="toggle"><input type="checkbox" id="longSession"> Long session (full conversation)</label>
      <div class="mic" id="micBtn">🎙️</div>
      <div class="status" id="recStatus">&nbsp;</div>
    </div>
    <div id="lastCard"></div>
  </section>

  <!-- TIMELINE -->
  <section id="tab-timeline" class="hidden">
    <div id="timelineRoot"><div class="card muted">Loading your day…</div></div>
  </section>

  <!-- FRIENDS -->
  <section id="tab-friends" class="hidden">
    <div id="friends"></div>
  </section>

  <!-- STATS -->
  <section id="tab-stats" class="hidden">
    <div id="stats"><div class="card muted">Log a few check-ins to build your report.</div></div>
  </section>

  <!-- DEBRIEF -->
  <section id="tab-debrief" class="hidden">
    <div id="avatarWrap" class="hidden" style="margin-bottom:14px">
      <div style="position:relative;border-radius:14px;overflow:hidden;background:#111">
        <video id="avatarVideo" autoplay playsinline style="width:100%;display:block;max-height:420px;object-fit:cover"></video>
        <audio id="avatarAudio" autoplay></audio>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button id="micToggle" class="btn" style="flex:1;padding:12px">🎤 Speak</button>
        <button id="endCall" class="btn" style="flex:1;padding:12px;background:#ff4d4f">End</button>
      </div>
    </div>
    <div id="debriefBox" class="card center muted">
      Generate a personalized recap of your emotional day.
    </div>
    <button class="btn" id="debriefBtn">Generate today's debrief</button>
  </section>
</div>

<nav>
  <button data-tab="checkin" class="active"><span class="ico">🎙️</span>Check in</button>
  <button data-tab="timeline"><span class="ico">📜</span>Timeline</button>
  <button data-tab="friends"><span class="ico">👥</span>Friends</button>
  <button data-tab="stats"><span class="ico">📊</span>Stats</button>
  <button data-tab="debrief"><span class="ico">🎬</span>Debrief</button>
</nav>

<script>
const USER = "demo-user";
const API = ""; // same origin as this page

function valColor(v){ const t=Math.max(0,Math.min(1,(v+1)/2)); const hue=t*120; return `hsl(${hue} 70% 55%)`; }
function emoji(label){
  const l=(label||"").toLowerCase();
  if(/joy|ecsta|amus/.test(l))return"😄"; if(/satisf|content|calm|relief/.test(l))return"🙂";
  if(/excit|triumph|pride/.test(l))return"🤩"; if(/love|ador|romance/.test(l))return"🥰";
  if(/sad|disappoint|grief/.test(l))return"😔"; if(/anx|fear|distress|horror/.test(l))return"😰";
  if(/anger|contempt|disgust/.test(l))return"😠"; if(/tired|bored/.test(l))return"😴";
  if(/pain|suffer/.test(l))return"😣"; return"🎭";
}
function hm(ts){ const d=new Date(ts); return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }

// ---- tabs ----
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['checkin','timeline','friends','stats','debrief'].forEach(t=>document.getElementById('tab-'+t).classList.add('hidden'));
  document.getElementById('tab-'+b.dataset.tab).classList.remove('hidden');
  if(b.dataset.tab==='timeline') loadTimeline();
  if(b.dataset.tab==='friends') loadFriends();
  if(b.dataset.tab==='stats') loadStats();
});

// ---- friends (placeholder roster — swap for real friends API later) ----
const FRIENDS=[
  {name:"Abhi",    feeling:"Excitement", valence: 0.62, streak:12, ago:"8m ago",  kudos:3},
  {name:"Pooja",   feeling:"Calm",       valence: 0.34, streak:27, ago:"1h ago",  kudos:7},
  {name:"Patrick", feeling:"Anxiety",    valence:-0.41, streak:4,  ago:"3h ago",  kudos:1},
];
function initials(name){ const p=name.trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase(); }
function loadFriends(){
  document.getElementById('friends').innerHTML=FRIENDS.map((f,i)=>`
    <div class="card">
      <div class="row" style="border:none;padding:0">
        <div class="avatar" style="background:${valColor(f.valence)}">${initials(f.name)}</div>
        <div class="grow"><div class="title">${f.name}</div><div class="time">${f.ago} · ${f.streak}-day streak</div></div>
        <div class="streak">🔥 ${f.streak}</div>
      </div>
      <div class="friendfeel">
        <div class="emoji">${emoji(f.feeling)}</div>
        <div class="grow">
          <div style="font-size:14px;margin-bottom:6px">Felt ${f.feeling.toLowerCase()}</div>
          <div class="bar"><div style="width:${(f.valence+1)/2*100}%;background:${valColor(f.valence)}"></div></div>
        </div>
        <div class="dot" style="background:${valColor(f.valence)}"></div>
      </div>
      <div class="cardfoot">
        <button class="kudos" data-i="${i}" onclick="toggleKudos(this)">👏 <span>${f.kudos}</span></button>
        <span class="time">Kudos</span>
      </div>
    </div>`).join('');
}
function toggleKudos(btn){
  const f=FRIENDS[+btn.dataset.i], on=btn.classList.toggle('on');
  btn.querySelector('span').textContent = f.kudos + (on?1:0);
}

// ---- recording ----
let mediaRecorder, chunks=[], recording=false;
const micBtn=document.getElementById('micBtn'), recStatus=document.getElementById('recStatus');

micBtn.onclick=async()=>{
  if(recording){ mediaRecorder.stop(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    mediaRecorder=new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    chunks=[];
    mediaRecorder.ondataavailable=e=>chunks.push(e.data);
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      micBtn.classList.remove('recording'); recording=false; micBtn.textContent='🎙️';
      const type=mediaRecorder.mimeType||'audio/webm';
      const ext=type.includes('mp4')?'mp4':type.includes('ogg')?'ogg':'webm';
      const blob=new Blob(chunks,{type});
      await upload(blob, ext);
    };
    mediaRecorder.start();
    recording=true; micBtn.classList.add('recording'); micBtn.textContent='⏹';
    recStatus.textContent='Listening…';
  }catch(err){ recStatus.textContent='Microphone blocked. Allow mic access.'; }
};

function setProcessing(msg){
  micBtn.classList.add('processing'); micBtn.textContent='⏳';
  recStatus.innerHTML=`${msg} <span class="ldots"><span>·</span><span>·</span><span>·</span></span>`;
}
function clearProcessing(){
  micBtn.classList.remove('processing'); micBtn.textContent='🎙️';
}

async function upload(blob, ext){
  const fd=new FormData();
  fd.append('user_id', USER);
  fd.append('file', blob, 'clip.'+ext);
  const long=document.getElementById('longSession').checked;
  try{
    if(long){
      setProcessing('Uploading conversation');
      const r=await fetch(API+'/recordings',{method:'POST',body:fd}).then(r=>r.json());
      await pollRecording(r.recording_id);
      clearProcessing(); recStatus.textContent='Added to your timeline.';
    }else{
      setProcessing('Reading the room');
      const snap=await fetch(API+'/checkins',{method:'POST',body:fd}).then(r=>r.json());
      clearProcessing(); renderLastCard(snap); recStatus.textContent='';
    }
  }catch(e){ clearProcessing(); recStatus.textContent='Upload failed — is the backend running?'; }
}

async function pollRecording(id){
  for(let i=0;i<60;i++){
    const rec=await fetch(API+'/recordings/'+id).then(r=>r.json());
    setProcessing(`Analyzing ${rec.chunks_done}/${rec.chunk_count||1} segments`);
    if(rec.status==='ready'||rec.status==='error') return;
    await new Promise(r=>setTimeout(r,2000));
  }
}

function card(snap){
  const top=(snap.top_emotions||[]).slice(0,4).map(e=>`<span class="pill">${e.name} ${Math.round(e.score*100)}%</span>`).join('');
  return `<div class="card">
    <div class="row" style="border:none;padding-bottom:6px">
      <div class="emoji">${emoji(snap.emotion_label)}</div>
      <div class="grow"><div class="title">${snap.emotion_label}</div><div class="time">${hm(snap.timestamp)}</div></div>
      <div class="dot" style="background:${valColor(snap.valence)}"></div>
    </div>
    <div class="bar"><div style="width:${(snap.valence+1)/2*100}%;background:${valColor(snap.valence)}"></div></div>
    <div style="margin-top:10px" class="scroll-x">${top}</div>
    ${snap.summary?`<div class="muted" style="margin-top:8px;font-size:13px">${snap.summary}</div>`:''}
  </div>`;
}
function renderLastCard(snap){ document.getElementById('lastCard').innerHTML=card(snap); }

// ---- timeline ----
// Curated, real links. "Reads" help process feelings; "distractions" gently pull
// attention elsewhere for a few minutes when emotions run hot.
const RESOURCES={
  reads:[
    {icon:'🧠', name:'Greater Good · UC Berkeley', desc:'Science-backed ways to work with hard feelings', url:'https://greatergood.berkeley.edu/topic/mindfulness'},
    {icon:'🌿', name:'Headspace — Articles', desc:'Calming anxiety, stress, and a racing mind', url:'https://www.headspace.com/articles'},
    {icon:'💬', name:'Mind — Coping & support', desc:'Practical guides for tough emotional moments', url:'https://www.mind.org.uk/information-support/'},
    {icon:'📓', name:'Verywell Mind — Emotions', desc:'How to sit with and move through what you feel', url:'https://www.verywellmind.com/emotions-4157191'},
  ],
  distractions:[
    {icon:'🌧️', name:'A Soft Murmur', desc:'Mix rain & ambient sound until things settle', url:'https://asoftmurmur.com'},
    {icon:'🪟', name:'WindowSwap', desc:"Look out of a stranger's window, somewhere", url:'https://www.window-swap.com'},
    {icon:'✏️', name:'Quick, Draw!', desc:'Doodle against an AI for 20 silly seconds', url:'https://quickdraw.withgoogle.com'},
    {icon:'🎲', name:'The Useless Web', desc:'Teleport to a pointless, delightful corner', url:'https://theuselessweb.com'},
  ]
};
function moodTone(v){
  if(v>=0.25)return['😄','a bright day'];
  if(v>=0.03)return['🙂','a steady day'];
  if(v>=-0.25)return['😕','a mixed day'];
  return['😔','a heavy day'];
}
function heroCard(avg){
  const [em,word]=moodTone(avg);
  return `<div class="card hero">
    <div class="eyebrow">Your day so far</div>
    <div class="herotop">
      <div class="heromood">${em} It's been ${word}</div>
      <span class="herochip">avg ${avg>=0?'+':''}${avg.toFixed(2)}</span>
    </div>
    <div class="bar big"><div style="width:${(avg+1)/2*100}%;background:${valColor(avg)}"></div></div>
  </div>`;
}
function linkRow(r){
  return `<a class="link" href="${r.url}" target="_blank" rel="noopener noreferrer">
    <span class="linkico">${r.icon}</span>
    <span class="grow"><div class="title" style="font-size:14px">${r.name}</div><div class="time">${r.desc}</div></span>
    <span class="chev">↗</span>
  </a>`;
}
function supportCard(heavy){
  return `<div class="card support ${heavy?'warm':''}">
    <h2 style="margin-bottom:12px">${heavy?"Today's been heavy — be gentle with yourself 💜":"Wellbeing toolkit 🧰"}</h2>
    <div class="breathe">
      <div class="ball" id="breatheBall"></div>
      <div class="grow"><div class="title" id="breatheLabel">Take a breath</div><div class="time">Box breathing · in 4 · hold 4 · out 4 · hold 4</div></div>
      <button class="kudos" id="breatheBtn" onclick="toggleBreathe(this)">Start</button>
    </div>
    <div class="seclabel">Reads that help</div>
    ${RESOURCES.reads.map(linkRow).join('')}
    <div class="seclabel">A small distraction</div>
    ${RESOURCES.distractions.map(linkRow).join('')}
  </div>`;
}
let breatheTimer=null;
function toggleBreathe(btn){
  const ball=document.getElementById('breatheBall'), label=document.getElementById('breatheLabel');
  if(breatheTimer){ clearInterval(breatheTimer); breatheTimer=null; ball.classList.remove('run'); label.textContent='Take a breath'; btn.textContent='Start'; return; }
  ball.classList.add('run'); btn.textContent='Stop';
  const phases=['Breathe in…','Hold…','Breathe out…','Hold…']; let i=0; label.textContent=phases[0];
  breatheTimer=setInterval(()=>{
    const lbl=document.getElementById('breatheLabel');
    if(!lbl){ clearInterval(breatheTimer); breatheTimer=null; return; }   // timeline re-rendered
    i=(i+1)%phases.length; lbl.textContent=phases[i];
  },4000);
}
async function loadTimeline(){
  if(breatheTimer){ clearInterval(breatheTimer); breatheTimer=null; }
  const root=document.getElementById('timelineRoot');
  try{
    const snaps=await fetch(API+'/checkins?user_id='+USER).then(r=>r.json());
    if(!snaps.length){
      root.innerHTML=`<div class="card center muted" style="padding:34px 16px">
        <div style="font-size:42px">🎭</div>
        <div style="margin-top:8px">No moments yet today.</div>
        <div class="time" style="margin-top:4px">Record a check-in and your day will unfold here.</div>
      </div>`+supportCard(false);
      return;
    }
    snaps.sort((a,b)=>b.timestamp.localeCompare(a.timestamp));
    const avg=snaps.reduce((s,x)=>s+(x.valence||0),0)/snaps.length;
    const heavy=avg<0;
    const nodes=snaps.map(s=>`
      <div class="tnode">
        <div class="rail"><div class="mk" style="background:${valColor(s.valence)}"></div></div>
        <div class="tbody">
          <div class="row" style="border:none;padding:0">
            <div class="emoji" style="font-size:22px">${emoji(s.emotion_label)}</div>
            <div class="grow"><div class="title">${s.emotion_label}</div><div class="time">${s.summary||s.context_tag||''}</div></div>
            <div class="time">${hm(s.timestamp)}</div>
          </div>
        </div>
      </div>`).join('');
    const moments=`<div class="card">
      <div class="row" style="border:none;padding:0;margin-bottom:14px">
        <h2 class="grow" style="margin:0">Today's moments</h2>
        <span class="herochip">${snaps.length}</span>
      </div>
      <div class="tline">${nodes}</div>
    </div>`;
    root.innerHTML = heroCard(avg) + (heavy?supportCard(true):'') + moments + (heavy?'':supportCard(false));
  }catch(e){ root.innerHTML='<div class="card muted">Backend unreachable.</div>'; }
}

// ---- stats ----
async function loadStats(){
  const box=document.getElementById('stats');
  try{
    const d=await fetch(API+'/dashboard?user_id='+USER).then(r=>r.json());
    if(!d.checkin_count){ box.innerHTML='<div class="card muted">Log a few check-ins to build your report.</div>'; return; }
    const heat=d.heatmap.map(b=>`<div title="${b.hour}:00" style="background:${b.count?valColor(b.avg_valence):'#2c2f38'}"></div>`).join('');
    const trig=d.top_triggers.length?d.top_triggers.map(t=>`<div class="row"><div class="grow">${t.context_tag}</div><div class="time">${t.count}×</div><div class="dot" style="background:${valColor(t.avg_valence)}"></div></div>`).join(''):'<div class="muted">No clear patterns yet.</div>';
    const labels=d.labels_breakdown.map(l=>`<span class="pill">${emoji(l.label)} ${l.label} ×${l.count}</span>`).join('');
    box.innerHTML=`
      <div class="card"><div class="tiles">
        <div class="tile"><div class="v">🔥 ${d.streak_days}</div><div class="t">Day streak</div></div>
        <div class="tile"><div class="v">${d.checkin_count}</div><div class="t">Moments</div></div>
        <div class="tile"><div class="v">${d.avg_valence>=0?'+':''}${d.avg_valence.toFixed(2)}</div><div class="t">Avg mood</div></div>
      </div></div>
      <div class="card"><h2>Mood through the day</h2>${sparkline(d.series)}</div>
      <div class="card"><h2>Emotional heatmap</h2><div class="heat">${heat}</div>
        <div class="heatlabels"><span>12a</span><span>12p</span><span>11p</span></div></div>
      <div class="card"><h2>What moved you</h2>${trig}</div>
      <div class="card"><h2>Feelings logged</h2><div class="scroll-x">${labels}</div></div>`;
  }catch(e){ box.innerHTML='<div class="card muted">Backend unreachable.</div>'; }
}

function sparkline(series){
  if(!series.length) return '<div class="muted">Not enough data.</div>';
  const W=440,H=140,pad=10;
  const xs=series.map((_,i)=>pad+(series.length<2?W/2:(i/(series.length-1))*(W-2*pad)));
  const ys=series.map(p=>H-pad-((p.valence+1)/2)*(H-2*pad));
  const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(' ');
  const dots=series.map((p,i)=>`<circle cx="${xs[i]}" cy="${ys[i]}" r="4" fill="${valColor(p.valence)}"/>`).join('');
  const mid=H-pad-0.5*(H-2*pad);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${pad}" y1="${mid}" x2="${W-pad}" y2="${mid}" stroke="#3a3d45" stroke-dasharray="4"/>
    <polyline points="${pts}" fill="none" stroke="#7c5cff" stroke-width="2.5"/>${dots}</svg>`;
}

// ---- debrief ----
let dailyCall=null, localAudioOn=true;

async function loadDailySDK(){
  if(window.DailyIframe) return;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://unpkg.com/@daily-co/daily-js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}

async function startAvatarCall(url){
  await loadDailySDK();
  if(dailyCall){ await dailyCall.leave(); dailyCall.destroy(); dailyCall=null; }
  document.getElementById('avatarWrap').classList.remove('hidden');
  localAudioOn=true;
  document.getElementById('micToggle').textContent='🎤 Speak';
  dailyCall=window.DailyIframe.createCallObject();
  dailyCall.on('track-started',({participant,track})=>{
    if(participant.local) return;
    if(track.kind==='video'){ const v=document.getElementById('avatarVideo'); v.srcObject=new MediaStream([track]); }
    else if(track.kind==='audio'){ const a=document.getElementById('avatarAudio'); a.srcObject=new MediaStream([track]); }
  });
  await dailyCall.join({url, startVideoOff:true});
  document.getElementById('micToggle').onclick=()=>{
    localAudioOn=!localAudioOn;
    dailyCall.setLocalAudio(localAudioOn);
    document.getElementById('micToggle').textContent=localAudioOn?'🎤 Speak':'🔇 Muted';
  };
  document.getElementById('endCall').onclick=async()=>{
    await dailyCall.leave(); dailyCall.destroy(); dailyCall=null;
    document.getElementById('avatarWrap').classList.add('hidden');
    document.getElementById('avatarVideo').srcObject=null;
  };
}

document.getElementById('debriefBtn').onclick=async()=>{
  const btn=document.getElementById('debriefBtn'), box=document.getElementById('debriefBox');
  btn.disabled=true; btn.textContent='Writing your script…';
  try{
    const start=await fetch(API+'/debrief/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:USER})}).then(r=>r.json());
    for(let i=0;i<80;i++){
      const d=await fetch(API+'/debrief/'+start.debrief_id).then(r=>r.json());
      btn.textContent={scripting:'Writing your script…',rendering:'Connecting to your avatar…'}[d.status]||'Working…';
      if(d.status==='ready'||d.status==='error'){ renderDebrief(d); break; }
      await new Promise(r=>setTimeout(r,2500));
    }
  }catch(e){ box.innerHTML='<div class="muted">Couldn\'t generate. Is the backend running?</div>'; box.className='card muted center'; }
  btn.disabled=false; btn.textContent='Regenerate debrief';
};

function renderDebrief(d){
  const box=document.getElementById('debriefBox'); box.className='card';
  let html='';
  if(d.conversation_url){ startAvatarCall(d.conversation_url); html+='<div class="muted center" style="font-size:13px">Avatar connecting…</div>'; }
  if(d.script) html+=`<h2 style="margin-top:${d.conversation_url?'12px':'0'}">Today\'s debrief</h2><div class="script">${d.script}</div>`;
  if(!d.conversation_url && d.status==='ready') html+='<div class="muted" style="margin-top:8px;font-size:12px">Script ready — add a Tavus API key for the live avatar.</div>';
  if(d.status==='error') html+=`<div class="muted" style="color:#ff6b6b">${d.error||'error'}</div>`;
  box.innerHTML=html;
}
</script>
